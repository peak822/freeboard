# ==============================================================================
# ESP32 + ESPHome + Firebase RTDB — Phase 2
# L2: Random / Simulated Sensor Values → HTTP PUT → Firebase /latest
#
# Target Path: /lab/esp32-01/latest.json
# Method: HTTP PUT
#
# Simulated Sensor Suite (Local ESP32 Generation):
#   - temp:  25.0 – 35.0 °C (update 5s, 1 decimal place)
#   - humi:  50.0 – 80.0 %  (update 5s, 1 decimal place)
#   - light: 100 – 1000 lx  (update 5s, integer)
#
# Timing:
#   - Sensor update frequency: ~5 seconds
#   - Cloud Firebase upload frequency: ~10 seconds
# ==============================================================================

esphome:
  name: esp32-01
  comment: "Phase 2 L2 - Simulated Sensor Values to Firebase RTDB via HTTP PUT"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  on_connect:
    then:
      - logger.log: "WiFi Connected! ESP32 online and ready for L2 sensor simulation."

# HTTPS REST Client
http_request:
  timeout: 10s

# Simulated Template Sensors (Updated locally every 5 seconds)
sensor:
  - platform: template
    name: "Temperature"
    id: temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      float val = 25.0 + random_float() * 10.0;
      ESP_LOGD("sensor.temp", "Simulated Temp: %.1f °C", val);
      return val;

  - platform: template
    name: "Humidity"
    id: humi
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      float val = 50.0 + random_float() * 30.0;
      ESP_LOGD("sensor.humi", "Simulated Humi: %.1f %%", val);
      return val;

  - platform: template
    name: "Light"
    id: light
    unit_of_measurement: "lx"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      float val = 100.0 + random_float() * 900.0;
      ESP_LOGD("sensor.light", "Simulated Light: %.0f lx", val);
      return roundf(val);

  - platform: template
    name: "Air Pressure"
    id: press
    unit_of_measurement: "hPa"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      float val = 950.0 + random_float() * 100.0;
      ESP_LOGD("sensor.press", "Simulated Press: %.1f hPa", val);
      return val;

  - platform: template
    name: "Carbon Dioxide"
    id: co2
    unit_of_measurement: "ppm"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      float val = 400.0 + random_float() * 800.0;
      ESP_LOGD("sensor.co2", "Simulated CO2: %.0f ppm", val);
      return roundf(val);

  - platform: template
    name: "Sound Noise"
    id: noise
    unit_of_measurement: "dB"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      float val = 30.0 + random_float() * 60.0;
      ESP_LOGD("sensor.noise", "Simulated Noise: %.1f dB", val);
      return val;

# Cloud Firebase Upload Pipeline (Uploads latest state every 10 seconds)
interval:
  - interval: 10s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - logger.log:
                format: "Uploading latest 6-sensor data to Firebase -> /lab/esp32-01/latest"
            - http_request.put:
                url: !secret firebase_latest_url
                json: |-
                  root["temp"] = id(temp).state;
                  root["humi"] = id(humi).state;
                  root["light"] = id(light).state;
                  root["press"] = id(press).state;
                  root["co2"] = id(co2).state;
                  root["noise"] = id(noise).state;
                on_response:
                  then:
                    - if:
                        condition:
                          lambda: 'return status_code == 200;'
                        then:
                          - logger.log:
                              format: "Firebase HTTP status: %d (Firebase upload successful)"
                              args: ['status_code']
                        else:
                          - logger.log:
                              format: "Firebase HTTP status: %d (Firebase upload failed)"
                              args: ['status_code']
          else:
            - logger.log: "Skip Firebase: WiFi not connected"
