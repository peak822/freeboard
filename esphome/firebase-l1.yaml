# ==============================================================================
# ESP32 + ESPHome + Firebase RTDB — Phase 2
# L1: เชื่อมต่อ ESPHome กับ Firebase Realtime Database ด้วยค่าคงที่
#
# Target Path: /lab/esp32-01/latest.json
# Method: HTTP PUT
# Constant Test Values:
#   - temp:  30
#   - humi:  60
#   - light: 500
#
# Requirements:
#   - ESPHome Framework: esp-idf on esp32dev
#   - Wi-Fi credentials via !secret wifi_ssid & wifi_password
#   - HTTP Request timeout: 10s
#   - Check Wi-Fi before sending
#   - Clear HTTP status logging in console
# ==============================================================================

esphome:
  name: esp32-01
  comment: "Phase 2 L1 - Constant Data to Firebase RTDB via HTTP PUT"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  on_connect:
    then:
      - logger.log: "WiFi Connected! Ready to send L1 constant payload to Firebase..."

# HTTPS REST Client
http_request:
  timeout: 10s

# Periodic Upload Interval (Every 10 seconds)
interval:
  - interval: 10s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - logger.log: "Sending L1 Constant Data: temp=30, humi=60, light=500 -> /lab/esp32-01/latest"
            - http_request.put:
                url: !secret firebase_latest_url
                json: |-
                  root["temp"] = 30;
                  root["humi"] = 60;
                  root["light"] = 500;
                on_response:
                  then:
                    - logger.log:
                        format: "Firebase HTTP status = %d"
                        args: ['status_code']
          else:
            - logger.log: "Skip Firebase: WiFi not connected"
