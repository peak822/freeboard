# ==============================================================================
# L4 — Add SNTP and Timestamp
# Path: /lab/esp32-01/history.json (Method: POST)
# Adds SNTP synchronization (Asia/Bangkok) and Unix timestamp (seconds).
# Only sends data when Wi-Fi is connected and SNTP time is valid.
# ==============================================================================

esphome:
  name: esp32-01
  comment: "L4 - SNTP Time + Timestamped History to Firebase RTDB"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

time:
  - platform: sntp
    id: sntp_time
    timezone: "Asia/Bangkok"
    on_time_sync:
      then:
        - logger.log: "Time synchronized"

http_request:
  timeout: 10s

sensor:
  - platform: template
    name: "Temperature"
    id: temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      return 25.0 + random_float() * 10.0;

  - platform: template
    name: "Humidity"
    id: humi
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      return 50.0 + random_float() * 30.0;

  - platform: template
    name: "Light"
    id: light
    unit_of_measurement: "lx"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return 100.0 + random_float() * 900.0;

interval:
  - interval: 10s
    then:
      - if:
          condition:
            lambda: 'return wifi::global_wifi_component->is_connected() && id(sntp_time).now().is_valid();'
          then:
            - http_request.post:
                url: !secret firebase_history_url
                json: |-
                  root["temp"] = id(temp).state;
                  root["humi"] = id(humi).state;
                  root["light"] = id(light).state;
                  root["timestamp"] = id(sntp_time).now().timestamp;
                on_response:
                  then:
                    - logger.log:
                        format: "History HTTP status = %d"
                        args: ['status_code']
          else:
            - logger.log: "Skip Firebase: WiFi or time not ready"
