# ==============================================================================
# ESP32 IoT Firebase Production Configuration (Final)
# System: ESP32 + ESPHome + Firebase Realtime Database + GitHub Pages Dashboard
# Architecture:
#   - ESPHome Framework: ESP-IDF on ESP32
#   - Sensors: Temperature (25-35°C), Humidity (50-80%), Light (100-1000 lx)
#   - SNTP Clock: Asia/Bangkok
#   - Realtime Snapshot: PUT /lab/esp32-01/latest.json
#   - Time-series History: POST /lab/esp32-01/history.json
# ==============================================================================

esphome:
  name: esp32-01
  comment: "ESP32 Firebase IoT System - Production Release"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

# Wi-Fi Configuration with Secrets
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true

# SNTP Time Sync (Required for deterministic time series)
time:
  - platform: sntp
    id: sntp_time
    timezone: "Asia/Bangkok"
    on_time_sync:
      then:
        - logger.log: "Time synchronized"

# HTTPS REST Client
http_request:
  timeout: 10s

# Simulated Sensor Suite (5s update interval)
sensor:
  - platform: template
    name: "Temperature"
    id: temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      return 25.0 + random_float() * 10.0;

  - platform: template
    name: "Humidity"
    id: humi
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      return 50.0 + random_float() * 30.0;

  - platform: template
    name: "Light"
    id: light
    unit_of_measurement: "lx"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return 100.0 + random_float() * 900.0;

  - platform: template
    name: "Air Pressure"
    id: press
    unit_of_measurement: "hPa"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      return 950.0 + random_float() * 100.0;

  - platform: template
    name: "Carbon Dioxide"
    id: co2
    unit_of_measurement: "ppm"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return 400.0 + random_float() * 800.0;

  - platform: template
    name: "Sound Noise"
    id: noise
    unit_of_measurement: "dB"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      return 30.0 + random_float() * 60.0;

# Dual Upload Pipeline: 10s interval
interval:
  - interval: 10s
    then:
      - if:
          condition:
            lambda: 'return wifi::global_wifi_component->is_connected() && id(sntp_time).now().is_valid();'
          then:
            - logger.log:
                format: "Send temp=%.1f humi=%.1f light=%.0f press=%.1f co2=%.0f noise=%.1f"
                args: ['id(temp).state', 'id(humi).state', 'id(light).state', 'id(press).state', 'id(co2).state', 'id(noise).state']

            # 1. Update /latest
            - http_request.put:
                url: !secret firebase_latest_url
                json: |-
                  root["temp"] = id(temp).state;
                  root["humi"] = id(humi).state;
                  root["light"] = id(light).state;
                  root["press"] = id(press).state;
                  root["co2"] = id(co2).state;
                  root["noise"] = id(noise).state;
                  root["timestamp"] = id(sntp_time).now().timestamp;
                on_response:
                  then:
                    - logger.log:
                        format: "Latest HTTP status = %d"
                        args: ['status_code']

            # 2. Append to /history
            - http_request.post:
                url: !secret firebase_history_url
                json: |-
                  root["temp"] = id(temp).state;
                  root["humi"] = id(humi).state;
                  root["light"] = id(light).state;
                  root["press"] = id(press).state;
                  root["co2"] = id(co2).state;
                  root["noise"] = id(noise).state;
                  root["timestamp"] = id(sntp_time).now().timestamp;
                on_response:
                  then:
                    - logger.log:
                        format: "History HTTP status = %d"
                        args: ['status_code']
          else:
            - logger.log: "Skip Firebase: WiFi or time not ready"
